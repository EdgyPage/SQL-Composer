# Settings for the tools that run on `dev`: pytest and ruff. Nothing here is packaging - the
# Toolbox is a folder pasted over a directory at work, never installed.
# The development environment: `pip install -r requirements-dev.txt`.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = [".", "worked_examples", "tools"]
addopts = "-q --strict-markers --strict-config -rs"
filterwarnings = [
    # A warning nobody reads is indistinguishable from success, so the suite fails on one.
    "error",
    # ...except pytest's own config-time warnings, which are about the run, not the code.
    "default::pytest.PytestConfigWarning",
]

[tool.ruff]
line-length = 96
target-version = "py311"
# A Template's placeholders, such as <TABLE>, stop it parsing until it is filled in, on
# purpose: tests/test_project_templates.py fills each one in and checks that it runs. The
# Example projects' notebook sources are cells, whose imports sit at each cell's top. The
# Example projects as an earlier version left them, in tests/upgrade_from/, are kept frozen
# for the Upgrade's test, never edited.
extend-exclude = ["example_projects/*/admin/templates", "tools/example_project_sources",
                  "tests/upgrade_from"]

[tool.ruff.lint]
# The standard's rules ruff can hold (docs/agents/standards.md, Toolbox 8.0 ticket 01): line
# length, simpler forms, comprehensions, returns, and how many branches, returns and statements
# a function has. A break known when they were turned on is listed, by file, in
# tests/repo/known_breaks.py, which may only shrink.
extend-select = ["C901", "E501", "SIM", "C4", "RET", "PLR0911", "PLR0912", "PLR0915"]
# SIM108 asks for a conditional expression in place of an if/else, the reverse of simple over
# short. SIM905 asks for a word list as a long list literal. SIM300 reads an UPPERCASE name as a
# constant and turns a plain comparison round. RET503 doesn't know refuse() never returns.
ignore = ["SIM108", "SIM905", "SIM300", "RET503"]

[tool.ruff.lint.per-file-ignores]
# Its examples are commented out until you choose one, so its imports stand unused till then.
"**/admin/change_a_saved_table.ipynb" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 10
