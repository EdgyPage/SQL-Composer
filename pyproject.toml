# Settings for the tools that run on `dev`: pytest and ruff. Nothing here is packaging - the
# Toolbox is a folder pasted over a directory at work, never installed.
# The development environment: `pip install -r requirements-dev.txt`.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = [".", "worked_examples", "tools"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "needs_example_database: runs a query on the Example database: skips where this computer can't, and fails on a bug",
]
filterwarnings = [
    # A warning nobody reads is indistinguishable from success, so the suite fails on one.
    "error",
    # ...except pytest's own config-time warnings, which are about the run, not the code.
    "default::pytest.PytestConfigWarning",
    # ...and two pyspark raises in pytest's own Python, where Spark Composer's acceptance tests
    # ask a Spark there (tests/in_process_spark.py). pyspark 3.5.0's toPandas() uses distutils'
    # LooseVersion, and 3.5.0 and 4.0.4 leave each collect()'s socket to the garbage collector.
    "ignore:distutils Version classes are deprecated:DeprecationWarning:pyspark.sql.pandas.utils",
    "ignore:unclosed <socket\\.socket[^>]*raddr=\\('127\\.0\\.0\\.1':ResourceWarning",
]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
