# Settings for the tools that run on `dev`: pytest and ruff. Nothing here is packaging - the
# Toolbox is a folder pasted over a directory at work, never installed.
# The development environment: `pip install -r requirements-dev.txt`.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = [".", "worked_examples", "tools"]
addopts = "-q --strict-markers --strict-config -rs"
markers = [
    "needs_example_database: runs a query on the Example database: skips where this computer can't, and fails on a bug",
]
filterwarnings = [
    # A warning nobody reads is indistinguishable from success, so the suite fails on one.
    "error",
    # ...except pytest's own config-time warnings, which are about the run, not the code.
    "default::pytest.PytestConfigWarning",
]

[tool.ruff]
line-length = 96
target-version = "py311"
# A template's placeholders, such as <TABLE>, stop it parsing until it is filled in, on
# purpose: tests/test_templates.py fills each one in and checks that it parses and runs.
extend-exclude = ["templates"]

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
