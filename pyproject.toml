[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlcomposer"
version = "0.1.0"
description = "Assemble Hive SQL for closely-related business questions from declared, reusable parts, and emit column-level Lineage."
readme = "README.md"
requires-python = ">=3.11"

# Exact pins, not ranges. sqlglot is deliberately not semver - minor releases carry
# backwards-incompatible changes - and this library depends on behaviour its docs do not
# contract: Hive string-literal escaping, qualify() raising on an unknown column, and
# ErrorLevel.RAISE refusing an untranslatable construct. See
# docs/adr/0001-sqlglot-over-sqlalchemy.md. networkx is pinned for the same reason in
# miniature: the Lineage graph and the static artifact are git-tracked, and a traversal
# whose order changes turns a no-op upgrade into a diff across every artifact.
dependencies = [
    "sqlglot==30.18.0",
    "networkx==3.1",
]

[project.optional-dependencies]
# TEST ONLY. duckdb is never imported by anything under sqlcomposer/ - the core is
# compile-only and connects to nothing. It exists so the value tests can run the emitted
# SQL against something and check the numbers, and pandas so a Runner has a frame type.
# Installing the library does not install these.
test = [
    "duckdb==1.5.5",
    "pandas==2.0.3",
    "numpy==1.25.2",
    "pytest==9.0.2",
    "ruff==0.15.17",
]

[tool.setuptools]
# `declarations` ships with the library because it is the worked example the README and
# tools/smoke.py both read. It is an INVENTED FIXTURE, not anyone's schema; a real
# installation replaces it with a package generated from its own warehouse.
packages = ["sqlcomposer", "declarations"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# -q because the interesting output of this suite is the golden-SQL diff, not the dots.
# --strict-markers so a typo'd @pytest.mark is an error rather than a silently skipped
# intention - the same rule the library applies to a typo'd Tag.
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    # A warning nobody reads is indistinguishable from success, which is the whole
    # argument behind errors.warnings_are_refusals(). The test suite holds itself to it.
    "error",
    # ...except pytest's own config-time warnings, which are about the run rather than
    # about the code under test, and are raised before any test exists to fail. Left
    # fatal, an empty `tests/` or an ini key a future pytest stops recognising crashes the
    # whole suite with a raw traceback instead of reporting anything.
    "default::pytest.PytestConfigWarning",
]

[tool.ruff]
line-length = 96
target-version = "py311"
