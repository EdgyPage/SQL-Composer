# Runs pytest on every push to `dev`, on Python 3.11, for each Edition at the bottom of the range
# it supports and at its pin in requirements-dev.txt, the newest version it is tested on:
# - sqlglot Composer supports sqlglot 25.24.2 up to (not including) 31, and runs at 25.24.2 and
#   30.19.0;
# - Spark Composer supports pyspark 3.5.0 up to (not including) 4.1, and runs at 3.5.0 and 4.0.4,
#   on Java 17, with sqlglot uninstalled and its Example database required to run.
# `main` has no CI: a workflow file there would sit outside its allowlist.
# Each action is pinned to the commit its tag named on 2026-10-06, so a moved tag runs nothing
# new, and the jobs may only read the repo.
name: dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  sqlglot-composer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlglot: ["25.24.2", "30.19.0"]
    name: sqlglot Composer (sqlglot ${{ matrix.sqlglot }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pip install "sqlglot==${{ matrix.sqlglot }}"
      - run: python -m pytest

  spark-composer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyspark: ["3.5.0", "4.0.4"]
    name: Spark Composer (pyspark ${{ matrix.pyspark }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: pip install "pyspark==${{ matrix.pyspark }}"
      - run: pip uninstall --yes sqlglot
      - name: sqlglot is gone
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('sqlglot') is not None)"
      - run: python -m pytest --edition spark --example-database required
